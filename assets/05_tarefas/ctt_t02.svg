<text x="35" y="905" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#20323d">A = abstrata | U = usuário fora do diálogo | I = interação | S = sistema.</text>
<text x="35" y="927" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#20323d">&gt;&gt; = ativação | []&gt;&gt; = ativação com dados | [] = escolha | [&gt; = desativação.</text>
<text x="35" y="949" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#20323d">Escolhas dependem do estado e das condições descritos no documento.</text>
<text x="35" y="971" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#20323d">Falha ou indisponibilidade: retornar conforme os planos do HTA; não há atendimento garantido.</text>

<text x="35" y="605" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#20323d">Nós decompostos: branco e borda simples. Folhas: verde, borda dupla e operação final.</text>
<text x="35" y="627" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#20323d">Planos: consultar a tabela de decomposição no documento.</text>
<text x="35" y="649" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#20323d">1 &gt; 2 &gt; 3; se a clínica não puder receber, voltar a 2 com outra opção.</text>

<text x="35" y="1249" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#20323d">Escolhas dependem do estado e das condições descritos no documento.</text>
<text x="35" y="1271" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#20323d">Falha ou indisponibilidade: retornar conforme os planos do HTA; não há atendimento garantido.</text>

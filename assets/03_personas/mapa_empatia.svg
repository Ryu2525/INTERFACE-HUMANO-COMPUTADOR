<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><title>Mapa de empatia P01 — hipóteses</title><rect width="1200" height="820" fill="#f6f8fa"/>
<text x="35" y="45" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#20323d">Mapa de empatia · P01 / Camila Rocha</text>
<text x="35" y="78" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">Proto-persona: todos os conteúdos são hipóteses; não representam coleta empírica.</text>
<rect x="35" y="110" width="550" height="195" rx="12" fill="#fff" stroke="#a8babf"/>
<text x="55" y="145" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#20323d">O que vê</text>
<text x="55" y="180" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">[H] Alterações em Bob; informações de busca</text>
<text x="55" y="204" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">divergentes; clínicas sem disponibilidade</text>
<text x="55" y="228" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">confirmada. H07: canais; H10: clínicas.</text>
<rect x="620" y="110" width="550" height="195" rx="12" fill="#fff" stroke="#a8babf"/>
<text x="640" y="145" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#20323d">O que ouve</text>
<text x="640" y="180" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">[H] Opiniões de familiares e conhecidos;</text>
<text x="640" y="204" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">orientações on-line possivelmente divergentes.</text>
<text x="640" y="228" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">H07.</text>
<rect x="35" y="330" width="550" height="195" rx="12" fill="#fff" stroke="#a8babf"/>
<text x="55" y="365" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#20323d">O que diz e faz</text>
<text x="55" y="400" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">[H] Descreve sinais com palavras cotidianas;</text>
<text x="55" y="424" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">tenta amparar Bob; pode preferir áudio. H06,</text>
<text x="55" y="448" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">H08, H09.</text>
<rect x="620" y="330" width="550" height="195" rx="12" fill="#fff" stroke="#a8babf"/>
<text x="640" y="365" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#20323d">O que pensa e sente</text>
<text x="640" y="400" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">[H] Teme atrasar atendimento ou deslocar-se sem</text>
<text x="640" y="424" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">necessidade; busca uma decisão acionável. H01,</text>
<text x="640" y="448" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">H02.</text>
<rect x="35" y="550" width="550" height="195" rx="12" fill="#fff" stroke="#a8babf"/>
<text x="55" y="585" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#20323d">Dores</text>
<text x="55" y="620" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">[H] Relato desorganizado, categorias ambíguas,</text>
<text x="55" y="644" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">transcrição incorreta, perguntas longas e</text>
<text x="55" y="668" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">clínica não confirmada. H02, H09, H10, H12.</text>
<rect x="620" y="550" width="550" height="195" rx="12" fill="#fff" stroke="#a8babf"/>
<text x="640" y="585" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#20323d">Ganhos esperados</text>
<text x="640" y="620" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">[H] Compreender motivos, limites e próximo</text>
<text x="640" y="644" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">passo, com menor hesitação em simulação. H02,</text>
<text x="640" y="668" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#20323d">H04, H11.</text>
<text x="35" y="800" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#20323d">Fonte: hipóteses da Entrega 1; revisão documental em 21/10/2026. SVG editável.</text>
</svg>
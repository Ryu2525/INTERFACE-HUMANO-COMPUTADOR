<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" font-family="Arial, sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="aG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d4a"/></marker><marker id="aB" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6a2f"/></marker><marker id="aN" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/></marker></defs>
<text x="540.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2d27">Mapa de objetivos — CI02 (Vinícius) · papel: profissional da clínica (condicional H03/H05)</text>
<rect x="10" y="90" width="1060" height="140" fill="#fafafa" stroke="#e2e2e2"/>
<text x="24" y="160.0" font-size="14" font-weight="bold" fill="#55625b" transform="rotate(-90 24 160.0)" text-anchor="middle">Finais</text>
<rect x="10" y="240" width="1060" height="140" fill="#fafafa" stroke="#e2e2e2"/>
<text x="24" y="310.0" font-size="14" font-weight="bold" fill="#55625b" transform="rotate(-90 24 310.0)" text-anchor="middle">Instr. diretos</text>
<rect x="10" y="390" width="1060" height="140" fill="#fafafa" stroke="#e2e2e2"/>
<text x="24" y="460.0" font-size="14" font-weight="bold" fill="#55625b" transform="rotate(-90 24 460.0)" text-anchor="middle">Instr. indiretos</text>
<rect x="60" y="56" width="1000" height="474" fill="none" stroke="#9aa79f" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="560.0" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d4a">Profissional da clínica (P03 — Marina) — ramo condicional a H03/H05</text>
<path d="M330,258.0 L540,212.0" fill="none" stroke="#2f5d4a" stroke-width="2" marker-end="url(#aG)"/>
<path d="M750,258.0 L540,212.0" fill="none" stroke="#2f5d4a" stroke-width="2" marker-end="url(#aG)"/>
<path d="M540,408.0 L750,362.0" fill="none" stroke="#8a6a2f" stroke-width="2" marker-end="url(#aB)"/>
<path d="M540,408.0 L540,385 L540,368 L590,368 L590,235 L560,235 L540,212.0" fill="none" stroke="#8a6a2f" stroke-width="2" marker-end="url(#aB)"/>
<rect x="415.0" y="108.0" width="250" height="104" rx="10" fill="#e3efe8" stroke="#2f5d4a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="540" y="130.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d27">O07 · final</text>
<text x="540" y="152.0" text-anchor="middle" font-size="13" fill="#33413a">quer decidir se a unidade pode</text>
<text x="540" y="169.0" text-anchor="middle" font-size="13" fill="#33413a">receber e avisar o tutor, sem</text>
<text x="540" y="186.0" text-anchor="middle" font-size="13" fill="#33413a">falsa expectativa</text>
<text x="657.0" y="204.0" text-anchor="end" font-size="12" fill="#5b6b63">tarefa: —</text>
<rect x="205.0" y="258.0" width="250" height="104" rx="10" fill="#ffffff" stroke="#2f5d4a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="330" y="280.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d27">O06 · instrumental direto</text>
<text x="330" y="302.0" text-anchor="middle" font-size="13" fill="#33413a">quer ver o caso e saber o que veio</text>
<text x="330" y="319.0" text-anchor="middle" font-size="13" fill="#33413a">do tutor e o que é automático</text>
<text x="447.0" y="354.0" text-anchor="end" font-size="12" fill="#5b6b63">tarefa: —</text>
<rect x="625.0" y="258.0" width="250" height="104" rx="10" fill="#ffffff" stroke="#2f5d4a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="750" y="280.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d27">O11 · instrumental direto</text>
<text x="750" y="302.0" text-anchor="middle" font-size="13" fill="#33413a">quer perguntar ao tutor o que</text>
<text x="750" y="319.0" text-anchor="middle" font-size="13" fill="#33413a">falta ou está contraditório</text>
<text x="867.0" y="354.0" text-anchor="end" font-size="12" fill="#5b6b63">tarefa: —</text>
<rect x="415.0" y="408.0" width="250" height="104" rx="10" fill="#f6f1e7" stroke="#8a6a2f" stroke-width="2"/>
<text x="540" y="430.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d27">O09 · instrumental indireto</text>
<text x="540" y="452.0" text-anchor="middle" font-size="13" fill="#33413a">quer não perder o que já contou ou</text>
<text x="540" y="469.0" text-anchor="middle" font-size="13" fill="#33413a">escreveu se algo falhar</text>
<text x="657.0" y="504.0" text-anchor="end" font-size="12" fill="#5b6b63">tarefa: T01/T02</text>
<text x="20" y="558" font-size="13" fill="#33413a">Setas: decomposição meio → fim (o instrumental aponta para o objetivo que serve); não representam ordem de telas nem fluxo.</text>
<text x="20" y="577" font-size="13" fill="#33413a">Formato completo “Você (papel) quer … para …” no dicionário da E9.</text>
<text x="20" y="596" font-size="13" fill="#33413a">Verde-escuro = final · branco = instrumental direto · bege = instrumental indireto.</text>
<text x="20" y="615" font-size="13" fill="#33413a">Borda tracejada = profissional da clínica (ramo condicional a H03/H05) · pontilhado cinza = comunicação entre papéis.</text>
</svg>
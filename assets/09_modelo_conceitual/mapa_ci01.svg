<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" font-family="Arial, sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="aG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d4a"/></marker><marker id="aB" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6a2f"/></marker><marker id="aN" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/></marker></defs>
<text x="540.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2d27">Mapa de objetivos — CI01 (Julian) · papel: tutor</text>
<rect x="10" y="90" width="1060" height="140" fill="#fafafa" stroke="#e2e2e2"/>
<text x="24" y="160.0" font-size="14" font-weight="bold" fill="#55625b" transform="rotate(-90 24 160.0)" text-anchor="middle">Finais</text>
<rect x="10" y="240" width="1060" height="140" fill="#fafafa" stroke="#e2e2e2"/>
<text x="24" y="310.0" font-size="14" font-weight="bold" fill="#55625b" transform="rotate(-90 24 310.0)" text-anchor="middle">Instr. diretos</text>
<rect x="10" y="390" width="1060" height="140" fill="#fafafa" stroke="#e2e2e2"/>
<text x="24" y="460.0" font-size="14" font-weight="bold" fill="#55625b" transform="rotate(-90 24 460.0)" text-anchor="middle">Instr. indiretos</text>
<rect x="60" y="56" width="1000" height="474" fill="none" stroke="#9aa79f" stroke-width="1.5"/>
<text x="560.0" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d4a">Tutor (P01 — Camila)</text>
<path d="M260,258.0 L260,212.0" fill="none" stroke="#2f5d4a" stroke-width="2" marker-end="url(#aG)"/>
<path d="M180,408.0 L260,362.0" fill="none" stroke="#8a6a2f" stroke-width="2" marker-end="url(#aB)"/>
<path d="M480,408.0 L480,385 L480,235 L330,235 L260,212.0" fill="none" stroke="#8a6a2f" stroke-width="2" marker-end="url(#aB)"/>
<path d="M650,258.0 L780,212.0" fill="none" stroke="#2f5d4a" stroke-width="2" marker-end="url(#aG)"/>
<path d="M920,258.0 L780,212.0" fill="none" stroke="#2f5d4a" stroke-width="2" marker-end="url(#aG)"/>
<path d="M800,408.0 L260,362.0" fill="none" stroke="#8a6a2f" stroke-width="2" marker-end="url(#aB)"/>
<path d="M800,408.0 L650,362.0" fill="none" stroke="#8a6a2f" stroke-width="2" marker-end="url(#aB)"/>
<rect x="135.0" y="108.0" width="250" height="104" rx="10" fill="#e3efe8" stroke="#2f5d4a" stroke-width="2"/>
<text x="260" y="130.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d27">O03 · final</text>
<text x="260" y="152.0" text-anchor="middle" font-size="13" fill="#33413a">quer entender se pode ser grave e</text>
<text x="260" y="169.0" text-anchor="middle" font-size="13" fill="#33413a">o que fazer agora, para decidir o</text>
<text x="260" y="186.0" text-anchor="middle" font-size="13" fill="#33413a">próximo passo</text>
<text x="377.0" y="204.0" text-anchor="end" font-size="12" fill="#5b6b63">tarefa: T03</text>
<rect x="655.0" y="108.0" width="250" height="104" rx="10" fill="#e3efe8" stroke="#2f5d4a" stroke-width="2"/>
<text x="780" y="130.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d27">O04 · final</text>
<text x="780" y="152.0" text-anchor="middle" font-size="13" fill="#33413a">quer chegar a um lugar que possa</text>
<text x="780" y="169.0" text-anchor="middle" font-size="13" fill="#33413a">atender o animal, para que ele</text>
<text x="780" y="186.0" text-anchor="middle" font-size="13" fill="#33413a">receba cuidado</text>
<text x="897.0" y="204.0" text-anchor="end" font-size="12" fill="#5b6b63">tarefa: T02</text>
<rect x="135.0" y="258.0" width="250" height="104" rx="10" fill="#ffffff" stroke="#2f5d4a" stroke-width="2"/>
<text x="260" y="280.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d27">O01 · instrumental direto</text>
<text x="260" y="302.0" text-anchor="middle" font-size="13" fill="#33413a">quer contar o que vê e conferir o</text>
<text x="260" y="319.0" text-anchor="middle" font-size="13" fill="#33413a">que foi entendido</text>
<text x="377.0" y="354.0" text-anchor="end" font-size="12" fill="#5b6b63">tarefa: T01</text>
<rect x="525.0" y="258.0" width="250" height="104" rx="10" fill="#ffffff" stroke="#2f5d4a" stroke-width="2"/>
<text x="650" y="280.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d27">O05 · instrumental direto</text>
<text x="650" y="302.0" text-anchor="middle" font-size="13" fill="#33413a">quer que a clínica conheça o caso,</text>
<text x="650" y="319.0" text-anchor="middle" font-size="13" fill="#33413a">enviando só o que decidir</text>
<text x="767.0" y="354.0" text-anchor="end" font-size="12" fill="#5b6b63">tarefa: T02</text>
<rect x="795.0" y="258.0" width="250" height="104" rx="10" fill="#ffffff" stroke="#2f5d4a" stroke-width="2"/>
<text x="920" y="280.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d27">O10 · instrumental direto</text>
<text x="920" y="302.0" text-anchor="middle" font-size="13" fill="#33413a">quer saber se a clínica vai</text>
<text x="920" y="319.0" text-anchor="middle" font-size="13" fill="#33413a">receber e avisar que está indo</text>
<text x="1037.0" y="354.0" text-anchor="end" font-size="12" fill="#5b6b63">tarefa: T02</text>
<rect x="55.0" y="408.0" width="250" height="104" rx="10" fill="#f6f1e7" stroke="#8a6a2f" stroke-width="2"/>
<text x="180" y="430.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d27">O08 · instrumental indireto</text>
<text x="180" y="452.0" text-anchor="middle" font-size="13" fill="#33413a">quer indicar de qual animal fala,</text>
<text x="180" y="469.0" text-anchor="middle" font-size="13" fill="#33413a">sem perder tempo com cadastro</text>
<text x="297.0" y="504.0" text-anchor="end" font-size="12" fill="#5b6b63">tarefa: T01</text>
<rect x="355.0" y="408.0" width="250" height="104" rx="10" fill="#f6f1e7" stroke="#8a6a2f" stroke-width="2"/>
<text x="480" y="430.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d27">O02 · instrumental indireto</text>
<text x="480" y="452.0" text-anchor="middle" font-size="13" fill="#33413a">quer responder só o que sabe sobre</text>
<text x="480" y="469.0" text-anchor="middle" font-size="13" fill="#33413a">o que ficou faltando</text>
<text x="597.0" y="504.0" text-anchor="end" font-size="12" fill="#5b6b63">tarefa: T03</text>
<rect x="675.0" y="408.0" width="250" height="104" rx="10" fill="#f6f1e7" stroke="#8a6a2f" stroke-width="2"/>
<text x="800" y="430.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d27">O09 · instrumental indireto</text>
<text x="800" y="452.0" text-anchor="middle" font-size="13" fill="#33413a">quer não perder o que já contou ou</text>
<text x="800" y="469.0" text-anchor="middle" font-size="13" fill="#33413a">escreveu se algo falhar</text>
<text x="917.0" y="504.0" text-anchor="end" font-size="12" fill="#5b6b63">tarefa: T01/T02</text>
<text x="20" y="558" font-size="13" fill="#33413a">Setas: decomposição meio → fim (o instrumental aponta para o objetivo que serve); não representam ordem de telas nem fluxo.</text>
<text x="20" y="577" font-size="13" fill="#33413a">Formato completo “Você (papel) quer … para …” no dicionário da E9.</text>
<text x="20" y="596" font-size="13" fill="#33413a">Verde-escuro = final · branco = instrumental direto · bege = instrumental indireto.</text>
<text x="20" y="615" font-size="13" fill="#33413a">Borda tracejada = profissional da clínica (ramo condicional a H03/H05) · pontilhado cinza = comunicação entre papéis.</text>
</svg>
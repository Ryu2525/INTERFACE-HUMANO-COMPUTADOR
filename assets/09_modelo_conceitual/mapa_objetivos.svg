<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="816" viewBox="0 0 1120 816">
<title>Mapa consolidado de objetivos — Equipe 26</title>
<desc>Decomposição de objetivos. Relações não indicam sequência temporal. Ramo clínico condicionado a H03 e H05.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="38" font-family="sans-serif" font-size="25" font-weight="bold" fill="#173b38">Mapa consolidado de objetivos — Equipe 26</text>
<text x="32" y="65" font-family="sans-serif" font-size="16" fill="#475569">CI01 + CI02 + CI03 · IDs compartilhados no dicionário</text>
<rect x="32" y="88" width="1056" height="48" rx="10" fill="#245f55"/>
<text x="560" y="119" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">Compreender o caso e apoiar a continuidade do cuidado</text>
<path d="M 18 112 V 228 H 32" fill="none" stroke="#94a3b8" stroke-width="2"/>
<rect x="32" y="160" width="1056" height="140" rx="10" fill="white" stroke="#cbd5e1"/>
<text x="50" y="187" font-family="sans-serif" font-size="18" font-weight="bold" fill="#334155">Relatar e interpretar</text>
<rect x="50" y="204" width="326" height="78" rx="8" fill="#edf6f3"/>
<text x="64" y="230" font-family="sans-serif" font-size="17" fill="#173b38">O01 — Relatar e revisar sinais</text>
<rect x="396" y="204" width="326" height="78" rx="8" fill="#edf6f3"/>
<text x="410" y="230" font-family="sans-serif" font-size="17" fill="#173b38">O02 — Complementar informações</text>
<text x="410" y="252" font-family="sans-serif" font-size="17" fill="#173b38">insuficientes</text>
<rect x="742" y="204" width="326" height="78" rx="8" fill="#edf6f3"/>
<text x="756" y="230" font-family="sans-serif" font-size="17" fill="#173b38">O03 — Compreender orientação e</text>
<text x="756" y="252" font-family="sans-serif" font-size="17" fill="#173b38">próximo passo</text>
<path d="M 18 112 V 392 H 32" fill="none" stroke="#94a3b8" stroke-width="2"/>
<rect x="32" y="324" width="1056" height="140" rx="10" fill="white" stroke="#cbd5e1"/>
<text x="50" y="351" font-family="sans-serif" font-size="18" font-weight="bold" fill="#334155">Buscar e comunicar</text>
<rect x="50" y="368" width="326" height="78" rx="8" fill="#edf6f3"/>
<text x="64" y="394" font-family="sans-serif" font-size="17" fill="#173b38">O04 — Localizar e contatar uma</text>
<text x="64" y="416" font-family="sans-serif" font-size="17" fill="#173b38">clínica</text>
<rect x="396" y="368" width="326" height="78" rx="8" fill="#edf6f3"/>
<text x="410" y="394" font-family="sans-serif" font-size="17" fill="#173b38">O05 — Revisar e autorizar</text>
<text x="410" y="416" font-family="sans-serif" font-size="17" fill="#173b38">compartilhamento</text>
<rect x="742" y="368" width="326" height="78" rx="8" fill="#edf6f3"/>
<text x="756" y="394" font-family="sans-serif" font-size="17" fill="#173b38">O10 — Acompanhar a resposta da</text>
<text x="756" y="416" font-family="sans-serif" font-size="17" fill="#173b38">clínica</text>
<path d="M 18 112 V 556 H 32" fill="none" stroke="#94a3b8" stroke-width="2"/>
<rect x="32" y="488" width="1056" height="140" rx="10" fill="white" stroke="#cbd5e1"/>
<text x="50" y="515" font-family="sans-serif" font-size="18" font-weight="bold" fill="#334155">Apoio à interação</text>

<text x="64" y="558" font-family="sans-serif" font-size="17" fill="#173b38">O08 — Identificar o animal do</text>
<text x="64" y="580" font-family="sans-serif" font-size="17" fill="#173b38">relato</text>
<rect x="396" y="532" width="326" height="78" rx="8" fill="#edf6f3"/>
<text x="410" y="558" font-family="sans-serif" font-size="17" fill="#173b38">O09 — Corrigir e recuperar a</text>
<text x="410" y="580" font-family="sans-serif" font-size="17" fill="#173b38">interação</text>
<path d="M 18 112 V 720 H 32" fill="none" stroke="#94a3b8" stroke-width="2"/>
<rect x="32" y="652" width="1056" height="140" rx="10" fill="white" stroke="#b45309" stroke-dasharray="7 4"/>
<text x="50" y="679" font-family="sans-serif" font-size="18" font-weight="bold" fill="#334155">Continuidade na clínica — H03/H05</text>
<rect x="50" y="696" width="326" height="78" rx="8" fill="#fff7ed"/>
<text x="64" y="722" font-family="sans-serif" font-size="17" fill="#173b38">O06 — Consultar o caso e</text>
<text x="64" y="744" font-family="sans-serif" font-size="17" fill="#173b38">conferir sua origem</text>
<rect x="396" y="696" width="326" height="78" rx="8" fill="#fff7ed"/>
<text x="410" y="722" font-family="sans-serif" font-size="17" fill="#173b38">O07 — Solicitar complemento e</text>
<text x="410" y="744" font-family="sans-serif" font-size="17" fill="#173b38">informar capacidade</text>
</svg>
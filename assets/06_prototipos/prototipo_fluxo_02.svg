<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794"><title>Entrega 6 - cartões em papel</title><rect width="100%" height="100%" fill="white"/>
<text x="35" y="35" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#111">ENTREGA 6 | PROTÓTIPO EM PAPEL | EQUIPE 26</text>
<text x="35" y="62" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Folha 2/6 · E6-v2 · 21/10/2026 · dados e retornos fictícios · recorte os cartões para simular</text>
<text x="35" y="88" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">E6:P04</text>
<rect x="35" y="100" width="330" height="610" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="53" y="130" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">PRÉ-TRIAGEM</text>
<line x1="49" y1="144" x2="351" y2="144" stroke="#777"/>
<text x="53" y="175" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#111">Recebemos seu relato</text>
<text x="53" y="198" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Análise ainda em andamento</text>
<text x="53" y="228" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#111">Animal: __________  Hora: ______</text>
<text x="53" y="252" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">O relato foi recebido.</text>
<text x="53" y="278" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Estamos analisando as</text>
<text x="53" y="297" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">informações.</text>
<text x="53" y="323" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Ainda não há uma conclusão.</text>
<rect x="51" y="354" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="60" y="376" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Voltar ao relato</text>
<rect x="51" y="398" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="60" y="420" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Buscar atendimento</text>
<text x="53" y="673" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">Se precisar de ajuda agora, busque</text>
<text x="53" y="688" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">atendimento.</text>
<text x="395" y="88" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">E6:P05</text>
<rect x="395" y="100" width="330" height="610" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="413" y="130" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">PRÉ-TRIAGEM</text>
<line x1="409" y1="144" x2="711" y2="144" stroke="#777"/>
<text x="413" y="175" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#111">Não foi possível enviar</text>
<text x="413" y="198" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Falha de conexão</text>
<text x="413" y="228" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Não há confirmação de</text>
<text x="413" y="247" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">recebimento.</text>
<text x="413" y="273" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Seu rascunho continua disponível.</text>
<text x="413" y="299" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Não é necessário redigitar.</text>
<rect x="411" y="330" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="420" y="352" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Tentar novamente</text>
<rect x="411" y="374" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="420" y="396" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Rever rascunho</text>
<rect x="411" y="418" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="420" y="440" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Contatar serviço já conhecido</text>
<rect x="411" y="462" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="420" y="484" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Buscar atendimento</text>
<text x="413" y="673" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">Não espere o envio para buscar ajuda se</text>
<text x="413" y="688" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">precisar.</text>
<text x="755" y="88" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">E6:P06</text>
<rect x="755" y="100" width="330" height="610" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="773" y="130" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">PRÉ-TRIAGEM</text>
<line x1="769" y1="144" x2="1071" y2="144" stroke="#777"/>
<text x="773" y="175" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#111">Ainda não foi possível</text>
<text x="773" y="198" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#111">concluir</text>
<text x="773" y="221" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">INCERTO: faltam informações</text>
<text x="773" y="251" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#111">Animal: __________  Hora: ______</text>
<text x="773" y="275" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Isso não significa “não</text>
<text x="773" y="294" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">emergência”.</text>
<text x="773" y="320" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Precisamos esclarecer quando o</text>
<text x="773" y="339" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">sinal começou.</text>
<text x="773" y="365" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Responda apenas com o que sabe.</text>
<text x="773" y="391" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Complementar pela conversa</text>
<rect x="771" y="406" width="298" height="34" fill="#fafafa" stroke="#777777" stroke-width="1.5"/>
<text x="779" y="424" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Ex.: hoje; há dois dias; não sei</text>
<rect x="771" y="462" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="780" y="484" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Enviar complemento</text>
<rect x="771" y="506" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="780" y="528" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Responder por opções</text>
<rect x="771" y="550" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="780" y="572" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Buscar atendimento</text>
<text x="773" y="673" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">Você pode buscar atendimento sem</text>
<text x="773" y="688" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">terminar a coleta.</text>
<text x="35" y="748" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Baixa fidelidade: a pessoa indica a ação; o mediador troca o cartão. Sem chamadas, rotas ou envios reais.</text>
<text x="35" y="775" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Projeto: Julian Ryu Takeda · João Pedro Gardenghi Peterutto · Vinícius de Castro Duarte</text>
</svg>
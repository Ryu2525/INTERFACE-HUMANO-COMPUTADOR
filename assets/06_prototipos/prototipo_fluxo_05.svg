<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794"><title>Entrega 6 - cartões em papel</title><rect width="100%" height="100%" fill="white"/>
<text x="35" y="35" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#111">ENTREGA 6 | PROTÓTIPO EM PAPEL | EQUIPE 26</text>
<text x="35" y="62" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Folha 5/6 · E6-v2 · 21/10/2026 · dados e retornos fictícios · recorte os cartões para simular</text>
<text x="35" y="88" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">E6:P13</text>
<rect x="35" y="100" width="330" height="610" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="53" y="130" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">PRÉ-TRIAGEM</text>
<line x1="49" y1="144" x2="351" y2="144" stroke="#777"/>
<text x="53" y="175" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#111">Contato com a unidade</text>
<text x="53" y="198" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Ligação não confirma atendimento</text>
<text x="53" y="228" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Unidade: __________________</text>
<text x="53" y="254" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Informe o que observou no animal.</text>
<text x="53" y="280" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Confira se a unidade pode</text>
<text x="53" y="299" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">atender.</text>
<text x="53" y="325" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Sem resposta ou diante de recusa,</text>
<text x="53" y="344" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">procure outra opção.</text>
<rect x="51" y="375" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="60" y="397" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Preparar ligação</text>
<rect x="51" y="419" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="60" y="441" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Revisar resumo (opcional)</text>
<rect x="51" y="463" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="60" y="485" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Escolher outra unidade</text>
<rect x="51" y="507" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="60" y="529" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Consultar rota</text>
<text x="53" y="673" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">No papel, o mediador fornece a resposta</text>
<text x="53" y="688" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">da unidade.</text>
<text x="395" y="88" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">E6:P14</text>
<rect x="395" y="100" width="330" height="610" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="413" y="130" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">PRÉ-TRIAGEM</text>
<line x1="409" y1="144" x2="711" y2="144" stroke="#777"/>
<text x="413" y="175" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#111">Conferir resumo</text>
<text x="413" y="198" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Antes de compartilhar</text>
<text x="413" y="228" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Destino: __________________</text>
<text x="413" y="254" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Tutor: respiração rápida; língua</text>
<text x="413" y="273" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">roxa.</text>
<text x="413" y="299" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">IA: possível emergência.</text>
<text x="413" y="325" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Registro: __________________</text>
<text x="413" y="351" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Correção ou complemento</text>
<rect x="411" y="366" width="298" height="52" fill="#fafafa" stroke="#777777" stroke-width="1.5"/>
<text x="419" y="384" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Anotação identificada como do</text>
<text x="419" y="402" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">tutor.</text>
<text x="413" y="435" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Autorização: desmarcada</text>
<rect x="411" y="450" width="298" height="52" fill="#fafafa" stroke="#777777" stroke-width="1.5"/>
<text x="419" y="468" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">[ ] Autorizo enviar ao destino</text>
<text x="419" y="486" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">acima.</text>
<rect x="411" y="524" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="420" y="546" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Compartilhar resumo</text>
<rect x="411" y="568" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="420" y="590" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Continuar sem compartilhar</text>
<rect x="411" y="612" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="420" y="634" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Buscar atendimento</text>
<text x="413" y="673" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">Confira conteúdo e destinatário antes</text>
<text x="413" y="688" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">de autorizar.</text>
<text x="755" y="88" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">E6:P15</text>
<rect x="755" y="100" width="330" height="610" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="773" y="130" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">PRÉ-TRIAGEM</text>
<line x1="769" y1="144" x2="1071" y2="144" stroke="#777"/>
<text x="773" y="175" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#111">Enviando o resumo</text>
<text x="773" y="198" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Aguardando confirmação de entrega</text>
<text x="773" y="228" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Destino: __________________</text>
<text x="773" y="254" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">O envio foi solicitado.</text>
<text x="773" y="280" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Ainda não há confirmação de</text>
<text x="773" y="299" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">entrega.</text>
<text x="773" y="325" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Isso não confirma atendimento.</text>
<rect x="771" y="356" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="780" y="378" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Voltar ao contato</text>
<rect x="771" y="400" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="780" y="422" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Buscar atendimento</text>
<text x="773" y="673" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">Você pode continuar buscando</text>
<text x="773" y="688" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">atendimento.</text>
<text x="35" y="748" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Baixa fidelidade: a pessoa indica a ação; o mediador troca o cartão. Sem chamadas, rotas ou envios reais.</text>
<text x="35" y="775" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Projeto: Julian Ryu Takeda · João Pedro Gardenghi Peterutto · Vinícius de Castro Duarte</text>
</svg>
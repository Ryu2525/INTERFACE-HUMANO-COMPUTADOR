<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794"><title>Entrega 6 - cartões em papel</title><rect width="100%" height="100%" fill="white"/>
<text x="35" y="35" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#111">ENTREGA 6 | PROTÓTIPO EM PAPEL | EQUIPE 26</text>
<text x="35" y="62" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Folha 4/6 · E6-v2 · 21/10/2026 · dados e retornos fictícios · recorte os cartões para simular</text>
<text x="35" y="88" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">E6:P10</text>
<rect x="35" y="100" width="330" height="610" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="53" y="130" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">PRÉ-TRIAGEM</text>
<line x1="49" y1="144" x2="351" y2="144" stroke="#777"/>
<text x="53" y="175" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#111">Onde buscar atendimento?</text>
<text x="53" y="198" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Definir região</text>
<text x="53" y="228" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Escolha como informar a região.</text>
<text x="53" y="254" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Sua localização será usada nesta</text>
<text x="53" y="273" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">busca.</text>
<text x="53" y="299" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Se preferir, digite o endereço.</text>
<rect x="51" y="330" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="60" y="352" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Usar minha localização</text>
<rect x="51" y="374" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="60" y="396" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Informar região manualmente</text>
<text x="53" y="673" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">Localização e horário não confirmam</text>
<text x="53" y="688" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">vaga.</text>
<text x="395" y="88" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">E6:P11</text>
<rect x="395" y="100" width="330" height="610" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="413" y="130" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">PRÉ-TRIAGEM</text>
<line x1="409" y1="144" x2="711" y2="144" stroke="#777"/>
<text x="413" y="175" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#111">Informar região</text>
<text x="413" y="198" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Localização recusada ou</text>
<text x="413" y="216" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">indisponível</text>
<text x="413" y="246" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Continue sem permitir</text>
<text x="413" y="265" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">localização.</text>
<text x="413" y="291" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Endereço ou região</text>
<rect x="411" y="306" width="298" height="52" fill="#fafafa" stroke="#777777" stroke-width="1.5"/>
<text x="419" y="324" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Digite uma referência para a</text>
<text x="419" y="342" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">busca.</text>
<text x="413" y="375" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Conferir região</text>
<rect x="411" y="390" width="298" height="34" fill="#fafafa" stroke="#777777" stroke-width="1.5"/>
<text x="419" y="408" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Região informada por você</text>
<rect x="411" y="446" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="420" y="468" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Buscar nessa região</text>
<rect x="411" y="490" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="420" y="512" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Voltar</text>
<text x="413" y="673" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">Corrija a região antes de buscar, se</text>
<text x="413" y="688" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">necessário.</text>
<text x="755" y="88" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">E6:P12</text>
<rect x="755" y="100" width="330" height="610" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="773" y="130" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">PRÉ-TRIAGEM</text>
<line x1="769" y1="144" x2="1071" y2="144" stroke="#777"/>
<text x="773" y="175" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#111">Opções de atendimento</text>
<text x="773" y="198" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Lista e mapa esquemático</text>
<rect x="771" y="224" width="298" height="65" fill="#fafafa" stroke="#777777" stroke-width="1.5"/>
<text x="780" y="241" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">Esquema sem escala</text>
<line x1="810" y1="261" x2="900" y2="273" stroke="#777"/>
<line x1="900" y1="273" x2="1005" y2="258" stroke="#777"/>
<text x="790" y="263" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#111">A</text>
<text x="1013" y="262" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#111">B</text>
<text x="773" y="304" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Unidade A (fictícia): 1,2 km</text>
<text x="773" y="330" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Informa atendimento 24h.</text>
<text x="773" y="356" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Unidade B (fictícia): 2,4 km</text>
<text x="773" y="382" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Horário não informado.</text>
<text x="773" y="408" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Capacidade: confirmar com a</text>
<text x="773" y="427" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">unidade.</text>
<rect x="771" y="458" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="780" y="480" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Contatar Unidade A</text>
<rect x="771" y="502" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="780" y="524" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Contatar Unidade B</text>
<rect x="771" y="546" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="780" y="568" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Alterar região</text>
<text x="773" y="673" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">Unidades fictícias: não execute</text>
<text x="773" y="688" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">ligações reais.</text>
<text x="35" y="748" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Baixa fidelidade: a pessoa indica a ação; o mediador troca o cartão. Sem chamadas, rotas ou envios reais.</text>
<text x="35" y="775" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Projeto: Julian Ryu Takeda · João Pedro Gardenghi Peterutto · Vinícius de Castro Duarte</text>
</svg>
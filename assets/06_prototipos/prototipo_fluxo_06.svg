<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794"><title>Entrega 6 - cartões em papel</title><rect width="100%" height="100%" fill="white"/>
<text x="35" y="35" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#111">ENTREGA 6 | PROTÓTIPO EM PAPEL | EQUIPE 26</text>
<text x="35" y="62" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Folha 6/6 · E6-v2 · 21/10/2026 · dados e retornos fictícios · recorte os cartões para simular</text>
<text x="35" y="88" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">E6:P16</text>
<rect x="35" y="100" width="330" height="610" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="53" y="130" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">PRÉ-TRIAGEM</text>
<line x1="49" y1="144" x2="351" y2="144" stroke="#777"/>
<text x="53" y="175" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#111">Resumo entregue</text>
<text x="53" y="198" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Entrega da mensagem confirmada</text>
<text x="53" y="228" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Destino: __________________</text>
<text x="53" y="254" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">A entrega do resumo foi</text>
<text x="53" y="273" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">confirmada.</text>
<text x="53" y="299" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Vaga e atendimento NÃO estão</text>
<text x="53" y="318" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">confirmados por esta mensagem.</text>
<text x="53" y="344" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Confirme diretamente com a</text>
<text x="53" y="363" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">unidade.</text>
<rect x="51" y="394" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="60" y="416" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Voltar ao contato</text>
<rect x="51" y="438" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="60" y="460" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Consultar rota</text>
<rect x="51" y="482" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="60" y="504" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Buscar atendimento</text>
<text x="53" y="673" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">Compartilhar não substitui avaliação</text>
<text x="53" y="688" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">veterinária.</text>
<text x="395" y="88" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">E6:P17</text>
<rect x="395" y="100" width="330" height="610" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="413" y="130" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">PRÉ-TRIAGEM</text>
<line x1="409" y1="144" x2="711" y2="144" stroke="#777"/>
<text x="413" y="175" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#111">Resumo não entregue</text>
<text x="413" y="198" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Falha no compartilhamento</text>
<text x="413" y="228" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Não há confirmação de entrega.</text>
<text x="413" y="254" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">O resumo revisado foi preservado.</text>
<text x="413" y="280" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Você pode relatar o caso por</text>
<text x="413" y="299" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">telefone ou pessoalmente.</text>
<rect x="411" y="330" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="420" y="352" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Tentar enviar novamente</text>
<rect x="411" y="374" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="420" y="396" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Rever destino e autorização</text>
<rect x="411" y="418" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="420" y="440" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Continuar pelo contato</text>
<rect x="411" y="462" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="420" y="484" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Buscar atendimento</text>
<text x="413" y="673" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">A falha não impede a procura por</text>
<text x="413" y="688" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">atendimento.</text>
<text x="755" y="88" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">E6:P18</text>
<rect x="755" y="100" width="330" height="610" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="773" y="130" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#111">PRÉ-TRIAGEM</text>
<line x1="769" y1="144" x2="1071" y2="144" stroke="#777"/>
<text x="773" y="175" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#111">Conferir destino e rota</text>
<text x="773" y="198" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Continuidade fora da pré-triagem</text>
<text x="773" y="228" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Destino: __________________</text>
<text x="773" y="254" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Endereço: __________________</text>
<text x="773" y="280" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Confirme o endereço com a</text>
<text x="773" y="299" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">unidade.</text>
<rect x="771" y="321" width="298" height="65" fill="#fafafa" stroke="#777777" stroke-width="1.5"/>
<text x="780" y="338" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">Esquema sem escala</text>
<line x1="810" y1="358" x2="900" y2="370" stroke="#777"/>
<line x1="900" y1="370" x2="1005" y2="355" stroke="#777"/>
<text x="790" y="360" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#111">De</text>
<text x="1013" y="359" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#111">Até</text>
<text x="773" y="401" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">A rota não garante que a unidade</text>
<text x="773" y="420" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">possa receber o animal.</text>
<rect x="771" y="451" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="780" y="473" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Abrir rota externa</text>
<rect x="771" y="495" width="298" height="35" fill="#f1f1f1" stroke="#333333" stroke-width="1.5"/>
<text x="780" y="517" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" fill="#111">Voltar ao contato</text>
<text x="773" y="673" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">Triagem e conduta continuam com a</text>
<text x="773" y="688" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#111">equipe veterinária.</text>
<text x="35" y="748" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#111">Baixa fidelidade: a pessoa indica a ação; o mediador troca o cartão. Sem chamadas, rotas ou envios reais.</text>
<text x="35" y="775" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#111">Projeto: Julian Ryu Takeda · João Pedro Gardenghi Peterutto · Vinícius de Castro Duarte</text>
</svg>